[project]
name = "neocortex"
version = "0.1.0"
description = "Multi-agent runner: cooperative scheduler, typed turn outcomes, deterministic arbiter"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
nc = "nc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nc"]

[tool.setuptools.package-data]
nc = ["static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
